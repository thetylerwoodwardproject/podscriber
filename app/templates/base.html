<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Podscriber{% endblock %}</title>
<link rel="stylesheet" href="{{ asset_url('css/theme.css') }}">
<script>
  (function () {
    var saved = localStorage.getItem("podscriber-theme");
    if (saved) document.documentElement.setAttribute("data-theme", saved);
  })();
</script>
</head>
<body>
<div class="layout">
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="brand">
        <div class="brand-mark">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0014 0"></path><path d="M12 18v3"></path></svg>
        </div>
        <span class="brand-name">Podscriber</span>
      </div>
      <button class="icon-btn" id="dark-mode-toggle" title="Toggle dark mode">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 2v2M12 20v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M2 12h2M20 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"></path></svg>
      </button>
    </div>

    <div class="nav">
      <a href="/" class="nav-btn {% if active_nav == 'library' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5"></path><path d="M6 9.5V19a1 1 0 001 1h3v-5.5h4V20h3a1 1 0 001-1V9.5"></path></svg>
        <span>Episodes</span>
      </a>
      <a href="/upload" class="nav-btn {% if active_nav == 'upload' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 8v8M8 12h8"></path></svg>
        <span>New Episode</span>
      </a>
      <a href="/analytics" class="nav-btn {% if active_nav == 'analytics' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M12 20V4M20 20v-7"></path></svg>
        <span>Analytics</span>
      </a>
      <a href="/improvements" class="nav-btn {% if active_nav == 'improvements' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="8" height="16" rx="2"></rect><rect x="13" y="4" width="8" height="16" rx="2"></rect></svg>
        <span>Improvements</span>
      </a>
      <a href="/generator" class="nav-btn {% if active_nav == 'generator' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
        <span>Generator</span>
      </a>
      <a href="/settings" class="nav-btn {% if active_nav == 'settings' %}active{% endif %}">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"></circle><circle cx="12" cy="12" r="8.2"></circle></svg>
        <span>Settings</span>
      </a>
    </div>

    <div class="divider"></div>

    <div>
      <div class="recent-label">Recent</div>
      {% for ep in recent_episodes %}
      <a href="/episodes/{{ ep.id }}" class="side-episode">
        <span class="dot" style="background: var(--status-{{ ep.status }}-fg)"></span>
        <span class="title">{{ ep.title or ep.original_filename }}</span>
      </a>
      {% endfor %}
    </div>
  </div>

  <div class="sidebar-overlay" id="sidebar-overlay"></div>

  <div class="main">
    <div class="mobile-topbar">
      <button class="icon-btn" id="sidebar-toggle" aria-label="Open menu" aria-expanded="false" aria-controls="sidebar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M3 12h18M3 18h18"></path></svg>
      </button>
      <span class="brand-name">Podscriber</span>
    </div>
    {% block content %}{% endblock %}
  </div>
</div>

<script src="{{ asset_url('js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
