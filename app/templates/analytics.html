{% extends "base.html" %}
{% block title %}Analytics — Podscriber{% endblock %}
{% block content %}
<div class="page-header">
  <div>
    <h1 class="page-title">Analytics</h1>
    <p class="page-sub">Directory metadata from PodcastIndex.org and download analytics from OP3.dev.</p>
  </div>
  <form method="post" action="/analytics/refresh" id="stats-refresh-form">
    <button type="submit" class="btn btn-outline">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 11-3-6.7M21 4v5h-5"></path></svg>
      Refresh
    </button>
  </form>
</div>

<div id="stats-content">
  {% include "analytics/_analytics_content.html" %}
</div>
{% endblock %}
{% block scripts %}
<script src="{{ asset_url('js/analytics.js') }}"></script>
{% endblock %}
