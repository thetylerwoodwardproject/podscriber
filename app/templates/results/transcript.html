<div style="max-width:820px">
  <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px">
    <span style="font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em">Full transcript</span>
    {% if transcript %}
    <a href="/episodes/{{ episode.id }}/transcript.vtt" class="btn btn-outline" style="padding:7px 14px;font-size:13px;display:flex;align-items:center;gap:6px">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v13M6 10l6 6 6-6"></path><path d="M5 21h14"></path></svg>
      Download VTT
    </a>
    {% endif %}
  </div>

  {% if transcript and transcript.segments %}
  <div style="display:flex;flex-direction:column;gap:2px;max-height:70vh;overflow-y:auto;background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:8px">
    {% for seg in transcript.segments %}
    <div style="display:flex;gap:16px;padding:10px 14px;border-radius:8px">
      <span style="font-family:ui-monospace,monospace;font-size:12px;color:var(--muted-light);flex-shrink:0;width:52px;padding-top:1px">{{ seg.start_ms | clock }}</span>
      <span style="font-size:14px;line-height:1.6">{{ seg.text }}</span>
    </div>
    {% endfor %}
  </div>
  {% else %}
  <div class="empty-state">No transcript available for this episode.</div>
  {% endif %}
</div>
