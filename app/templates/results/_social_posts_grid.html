{% for grp in (content.social_posts if content else []) %}
{% set group_index = loop.index0 %}
<div style="margin-bottom:30px">
  <div style="display:flex;align-items:center;gap:9px;margin-bottom:12px">
    <span style="width:26px;height:26px;border-radius:50%;background:{{ grp.color }};color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0">{{ grp.initial }}</span>
    <span style="font-weight:600;font-size:14.5px">{{ grp.platform }}</span>
  </div>
  <div class="social-grid">
    {% for post in grp.posts %}
    <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px">
      <form method="post" action="/episodes/{{ episode.id }}/social/{{ group_index }}/{{ loop.index0 }}/edit" data-ajax data-ajax-flash-target="textarea">
        <textarea name="text" rows="6" onchange="this.form.requestSubmit()" style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.55;background:var(--faint)">{{ post }}</textarea>
        <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
          <span style="font-size:12px;color:var(--muted-light)">{{ post | length }} chars</span>
        </div>
      </form>
    </div>
    {% endfor %}
  </div>
</div>
{% else %}
<div class="empty-state">No social posts generated.</div>
{% endfor %}
