<div class="social-grid">
  {% for post in (content.social_posts if content else []) %}
  <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:12px">
    <form method="post" action="/episodes/{{ episode.id }}/social/{{ loop.index0 }}/edit" data-ajax data-ajax-flash-target="textarea">
      <textarea name="text" rows="6" maxlength="280" onchange="this.form.requestSubmit()" style="border:1px solid var(--border);border-radius:10px;padding:12px 14px;font-size:13.5px;line-height:1.55;background:var(--faint)">{{ post.text }}</textarea>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px">
        <span style="font-size:12px;color:var(--muted-light)">{{ post.text | length }} / 280 chars</span>
      </div>
    </form>
    <form method="post" action="/episodes/{{ episode.id }}/social/{{ loop.index0 }}/hashtags/edit" data-ajax data-ajax-flash-target="input">
      <label class="field-label" style="margin-top:0;font-size:11px">Hashtags</label>
      <input type="text" name="hashtags" value="{{ post.hashtags | join(' ') }}" onchange="this.form.requestSubmit()" placeholder="#podcast #topic #guest" style="width:100%">
    </form>
  </div>
  {% else %}
  <div class="empty-state">No social posts generated.</div>
  {% endfor %}
</div>
